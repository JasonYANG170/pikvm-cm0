kvmd:
    msd:
        type: disabled
    gpio:
        drivers: {}
        scheme: {}
    hid:
        mouse_alt:
            device: /dev/kvmd-hid-mouse-alt
    streamer:
        quality: 80
        h264_bitrate:
            default: 5000
        h264_gop:
            default: 30
        desired_fps:
            default: 0
        resolution:
            default: 1920x1080
        cmd:
            - "/usr/bin/ustreamer"
            - "--device=/dev/kvmd-video"
            - "--dv-timings"
            - "--format=uyvy"
            - "--encoder=M2M-VIDEO"
            - "--quality={quality}"
            - "--h264-sink=kvmd::ustreamer::h264"
            - "--h264-sink-mode=0660"
            - "--h264-bitrate={h264_bitrate}"
            - "--h264-gop={h264_gop}"
            - "--workers=1"
            - "--buffers=3"
            - "--resolution={resolution}"
            - "--desired-fps={desired_fps}"
            - "--drop-same-frames=30"
            - "--last-as-blank=0"
            - "--unix={unix}"
            - "--unix-rm"
            - "--unix-mode=0660"
            - "--exit-on-parent-death"
            - "--process-name-prefix={process_name_prefix}"
            - "--notify-parent"
            - "--no-log-colors"
            - "--sink=kvmd::ustreamer::jpeg"
            - "--sink-mode=0660"
